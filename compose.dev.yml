name: trendwearshop
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD-root}
      MYSQL_USER: trendwearshop
      MYSQL_PASSWORD: trendwearshop
      MYSQL_DATABASE: trendwearshop
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    volumes:
      - ./data/mysql:/var/lib/mysql
      # - ./trendwearshop.sql:/docker-entrypoint-initdb.d/trendwearshop.sql
      # docker exec -i trendwearshop-mysql-1 mysqldump -u root -proot trendwearshop > trendwearshop.sql
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
